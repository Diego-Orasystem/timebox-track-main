<div class="h-screen flex">
  <aside
    class="fixed top-0 left-0 h-full p-4 flex flex-col shadow-xl z-20 transition-all duration-300 ease-in-out transform"
    [ngClass]="{
      'w-[220px]': !isSidebarCollapsed,
      'w-[80px]': isSidebarCollapsed,
      'bg-[white]': true,
      'border-r border-[var(--lines)]': true
    }"
  >
    <div
      class="h-[70px] flex items-center justify-center font-bold text-xl text-[var(--darkText)] border-b border-slate-100 pb-4 mb-2 overflow-hidden whitespace-nowrap"
    >
      <span
        *ngIf="!isSidebarCollapsed"
        class="opacity-100 transition-opacity duration-200"
        >TimeboxTrack</span
      >
      <span
        *ngIf="isSidebarCollapsed"
        class="opacity-100 transition-opacity duration-200"
        >TBT</span
      >
    </div>

    <nav class="flex-grow flex flex-col gap-4 overflow-y-auto">
      <!-- Sección de autenticación para usuarios no autenticados -->
      <div *ngIf="!isAuthenticated" class="flex flex-col gap-2">
        <h1
          class="text-xs uppercase font-semibold text-[var(--lightText)] mb-3 tracking-wider px-2 pt-2 transition-opacity duration-200"
          [ngClass]="{
            'opacity-100': !isSidebarCollapsed,
            'opacity-0 hidden': isSidebarCollapsed
          }"
        >
          Acceso
        </h1>

        <!-- Botón de Login -->
        <a
          class="flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 hover:text-[var(--lightText)] focus:outline-none"
          [routerLink]="'/login'"
          [ngClass]="{
            'justify-center': isSidebarCollapsed,
            'justify-start gap-3': !isSidebarCollapsed
          }"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"
            ></path>
          </svg>
          <span
            class="text-sm font-medium whitespace-nowrap overflow-hidden transition-opacity duration-200"
            [ngClass]="{
              'opacity-100 max-w-full': !isSidebarCollapsed,
              'opacity-0 max-w-0': isSidebarCollapsed
            }"
          >
            Iniciar Sesión
          </span>
        </a>

        <!-- Botón de Registro -->
        <a
          class="flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 hover:text-[var(--lightText)] focus:outline-none"
          [routerLink]="'/register'"
          [ngClass]="{
            'justify-center': isSidebarCollapsed,
            'justify-start gap-3': !isSidebarCollapsed
          }"
        >
          <svg
            class="h-5 w-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"
            ></path>
          </svg>
          <span
            class="text-sm font-medium whitespace-nowrap overflow-hidden transition-opacity duration-200"
            [ngClass]="{
              'opacity-100 max-w-full': !isSidebarCollapsed,
              'opacity-0 max-w-0': isSidebarCollapsed
            }"
          >
            Crear Cuenta
          </span>
        </a>
      </div>

      <!-- Menú principal solo para usuarios autenticados -->
      <div *ngIf="isAuthenticated">
        <h1
          class="text-xs uppercase font-semibold text-[var(--text-light)] mb-3 tracking-wider px-2 transition-opacity duration-200"
          [ngClass]="{
            'opacity-100': !isSidebarCollapsed,
            'opacity-0 hidden': isSidebarCollapsed
          }"
        >
          Menú
        </h1>

        <div class="flex flex-col gap-1 text-[var(--lightText)]">
          <a
            class="group flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 focus:outline-none"
            [routerLink]="'home'"
            routerLinkActive="active-link"
            [routerLinkActiveOptions]="{ exact: true }"
            [ngClass]="{
              'justify-center': isSidebarCollapsed,
              'justify-start gap-3': !isSidebarCollapsed
            }"
          >
            <!-- Ícono -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 transition-colors duration-200"
              [ngClass]="{
                'text-[var(--text-medium)] group-hover:text-white': true
              }"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"
              />
            </svg>

            <!-- Texto -->
            <span
              class="text-xs font-medium whitespace-nowrap text-[var(--text-medium)] group-hover:text-white overflow-hidden transition-all duration-200"
              [ngClass]="{
                ' opacity-100 max-w-full': !isSidebarCollapsed,
                'opacity-0 max-w-0': isSidebarCollapsed
              }"
            >
              Inicio
            </span>
          </a>
        </div>

        <div class="w-full h-px bg-slate-50 my-2"></div>

        <div
          *ngIf="hasPermission('timebox_management')"
          class="flex flex-col gap-1 text-[var(--lightText)]"
        >
          <h2
            class="text-xs uppercase font-medium text-[var(--text-light)] px-2 pb-1 transition-opacity duration-200"
            [ngClass]="{
              'opacity-100': !isSidebarCollapsed,
              'opacity-0 hidden': isSidebarCollapsed
            }"
          >
            Timebox
          </h2>
          <a
            class="group flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 focus:outline-none"
            [routerLink]="'/timebox-planning'"
            routerLinkActive="active-link"
            [ngClass]="{
              'justify-center': isSidebarCollapsed,
              'justify-start gap-3': !isSidebarCollapsed
            }"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 transition-colors duration-200"
              [ngClass]="{
                'text-[var(--text-medium)] group-hover:text-white': true
              }"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>

            <span
              class="text-xs font-medium whitespace-nowrap text-[var(--text-medium)] group-hover:text-white overflow-hidden transition-all duration-200"
              [ngClass]="{
                ' opacity-100 max-w-full': !isSidebarCollapsed,
                'opacity-0 max-w-0': isSidebarCollapsed
              }"
            >
              Timebox Planning
            </span>
          </a>
          <a
            class="group flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 focus:outline-none"
            [routerLink]="'/timebox-maintainer'"
            routerLinkActive="active-link"
            [ngClass]="{
              'justify-center': isSidebarCollapsed,
              'justify-start gap-3': !isSidebarCollapsed
            }"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 transition-colors duration-200"
              [ngClass]="{
                'text-[var(--text-medium)] group-hover:text-white': true
              }"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              />
            </svg>

            <span
              class="text-xs font-medium whitespace-nowrap text-[var(--text-medium)] group-hover:text-white overflow-hidden transition-all duration-200"
              [ngClass]="{
                ' opacity-100 max-w-full': !isSidebarCollapsed,
                'opacity-0 max-w-0': isSidebarCollapsed
              }"
            >
              Timebox Maintainer
            </span>
          </a>
          <a
            class="group flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 focus:outline-none"
            [routerLink]="'/timebox-requests'"
            routerLinkActive="active-link"
            [ngClass]="{
              'justify-center': isSidebarCollapsed,
              'justify-start gap-3': !isSidebarCollapsed
            }"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 transition-colors duration-200"
              [ngClass]="{
                'text-[var(--text-medium)] group-hover:text-white': true
              }"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M11.35 3.836c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m8.9-4.414c.376.023.75.05 1.124.08 1.131.094 1.976 1.057 1.976 2.192V16.5A2.25 2.25 0 0 1 18 18.75h-2.25m-7.5-10.5H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V18.75m-7.5-10.5h6.375c.621 0 1.125.504 1.125 1.125v9.375m-8.25-3 1.5 1.5 3-3.75"
              />
            </svg>

            <span
              class="text-xs font-medium whitespace-nowrap text-[var(--text-medium)] group-hover:text-white overflow-hidden transition-all duration-200"
              [ngClass]="{
                ' opacity-100 max-w-full': !isSidebarCollapsed,
                'opacity-0 max-w-0': isSidebarCollapsed
              }"
            >
              Timebox Requests
            </span>
          </a>
          <a
            class="group flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 focus:outline-none"
            [routerLink]="'/timebox-frappe-gantt'"
            routerLinkActive="active-link"
            [ngClass]="{
              'justify-center': isSidebarCollapsed,
              'justify-start gap-3': !isSidebarCollapsed
            }"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 transition-colors duration-200"
              [ngClass]="{
                'text-[var(--text-medium)] group-hover:text-white': true
              }"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6.75 2.994v2.25m10.5-2.25v2.25m-14.252 13.5V7.491a2.25 2.25 0 0 1 2.25-2.25h13.5a2.25 2.25 0 0 1 2.25 2.25v11.251m-18 0a2.25 2.25 0 0 0 2.25 2.25h13.5a2.25 2.25 0 0 0 2.25-2.25m-18 0v-7.5a2.25 2.25 0 0 1 2.25-2.25h13.5a2.25 2.25 0 0 1 2.25 2.25v7.5m-6.75-6h2.25m-9 2.25h4.5m.002-2.25h.005v.006H12v-.006Zm-.001 4.5h.006v.006h-.006v-.005Zm-2.25.001h.005v.006H9.75v-.006Zm-2.25 0h.005v.005h-.006v-.005Zm6.75-2.247h.005v.005h-.005v-.005Zm0 2.247h.006v.006h-.006v-.006Zm2.25-2.248h.006V15H16.5v-.005Z"
              />
            </svg>

            <span
              class="text-xs font-medium whitespace-nowrap text-[var(--text-medium)] group-hover:text-white overflow-hidden transition-all duration-200"
              [ngClass]="{
                ' opacity-100 max-w-full': !isSidebarCollapsed,
                'opacity-0 max-w-0': isSidebarCollapsed
              }"
            >
              Timebox Gantt
            </span>
          </a>
        </div>

        <div class="w-full h-px bg-slate-50 my-2"></div>

        <div
          *ngIf="hasPermission('task_management')"
          class="flex flex-col gap-1"
        >
          <h2
            class="text-xs uppercase font-medium text-[var(--text-light)] px-2 pb-1 transition-opacity duration-200"
            [ngClass]="{
              'opacity-100': !isSidebarCollapsed,
              'opacity-0 hidden': isSidebarCollapsed
            }"
          >
            Inbox
          </h2>
          <a
            class="group flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 focus:outline-none"
            [routerLink]="'task-inbox'"
            routerLinkActive="active-link"
            [ngClass]="{
              'justify-center': isSidebarCollapsed,
              'justify-start gap-3': !isSidebarCollapsed
            }"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 transition-colors duration-200"
              [ngClass]="{
                'text-[var(--text-medium)] group-hover:text-white': true
              }"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 3.75H6.912a2.25 2.25 0 0 0-2.15 1.588L2.35 13.177a2.25 2.25 0 0 0-.1.661V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 0 0-2.15-1.588H15M2.25 13.5h3.86a2.25 2.25 0 0 1 2.012 1.244l.256.512a2.25 2.25 0 0 0 2.013 1.244h3.218a2.25 2.25 0 0 0 2.013-1.244l.256-.512a2.25 2.25 0 0 1 2.013-1.244h3.859M12 3v8.25m0 0-3-3m3 3 3-3"
              />
            </svg>

            <span
              class="text-xs font-medium whitespace-nowrap text-[var(--text-medium)] group-hover:text-white overflow-hidden transition-all duration-200"
              [ngClass]="{
                ' opacity-100 max-w-full': !isSidebarCollapsed,
                'opacity-0 max-w-0': isSidebarCollapsed
              }"
            >
              Task Inbox
            </span>
          </a>
        </div>

        <div class="w-full h-px bg-slate-50 my-2"></div>

        <div class="flex flex-col gap-1">
          <h2
            class="text-xs uppercase font-medium text-[var(--text-light)] px-2 pb-1 transition-opacity duration-200"
            [ngClass]="{
              'opacity-100': !isSidebarCollapsed,
              'opacity-0 hidden': isSidebarCollapsed
            }"
          >
            Finanzas
          </h2>
          <a
            class="group flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 focus:outline-none"
            [routerLink]="'mis-pagos'"
            routerLinkActive="active-link"
            [ngClass]="{
              'justify-center': isSidebarCollapsed,
              'justify-start gap-3': !isSidebarCollapsed
            }"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 transition-colors duration-200"
              [ngClass]="{
                'text-[var(--text-medium)] group-hover:text-white': true
              }"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>

            <span
              class="text-xs font-medium whitespace-nowrap text-[var(--text-medium)] group-hover:text-white overflow-hidden transition-all duration-200"
              [ngClass]="{
                ' opacity-100 max-w-full': !isSidebarCollapsed,
                'opacity-0 max-w-0': isSidebarCollapsed
              }"
            >
              Mis pagos
            </span>
          </a>
          <a
            class="group flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 focus:outline-none"
            [routerLink]="'ordenes-pago'"
            routerLinkActive="active-link"
            [ngClass]="{
              'justify-center': isSidebarCollapsed,
              'justify-start gap-3': !isSidebarCollapsed
            }"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 transition-colors duration-200"
              [ngClass]="{
                'text-[var(--text-medium)] group-hover:text-white': true
              }"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m3.75 9v7.5m2.25-6.466a9.016 9.016 0 0 0-3.461-.203c-.536.072-.974.478-1.021 1.017a4.559 4.559 0 0 0-.018.402c0 .464.336.844.775.994l2.95 1.012c.44.15.775.53.775.994 0 .136-.006.27-.018.402-.047.539-.485.945-1.021 1.017a9.077 9.077 0 0 1-3.461-.203M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"
              />
            </svg>

            <span
              class="text-xs font-medium whitespace-nowrap text-[var(--text-medium)] group-hover:text-white overflow-hidden transition-all duration-200"
              [ngClass]="{
                ' opacity-100 max-w-full': !isSidebarCollapsed,
                'opacity-0 max-w-0': isSidebarCollapsed
              }"
            >
              Órdenes de Pago
            </span>
          </a>

          <!-- Gestor de Roles - Solo para usuarios con permisos de gestión de roles -->
          <a
            *ngIf="hasPermission('role_management')"
            class="group flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 focus:outline-none"
            [routerLink]="'gestor-roles'"
            routerLinkActive="active-link"
            [ngClass]="{
              'justify-center': isSidebarCollapsed,
              'justify-start gap-3': !isSidebarCollapsed
            }"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 transition-colors duration-200"
              [ngClass]="{
                'text-[var(--text-medium)] group-hover:text-white': true
              }"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm1.294 6.336a6.721 6.721 0 0 1-3.17.789 6.721 6.721 0 0 1-3.168-.789 3.376 3.376 0 0 1 6.338 0Z"
              />
            </svg>

            <span
              class="text-xs font-medium whitespace-nowrap text-[var(--text-medium)] group-hover:text-white overflow-hidden transition-all duration-200"
              [ngClass]="{
                ' opacity-100 max-w-full': !isSidebarCollapsed,
                'opacity-0 max-w-0': isSidebarCollapsed
              }"
            >
              Gestor de Roles
            </span>
          </a>
        </div>

        <!-- Sección de Administración - Solo para administradores -->
        <div
          *ngIf="hasPermission('user_management')"
          class="w-full h-px bg-slate-50 my-2"
        ></div>

        <div
          *ngIf="hasPermission('user_management')"
          class="flex flex-col gap-1"
        >
          <h2
            class="text-xs uppercase font-medium text-[var(--text-light)] px-2 pb-1 transition-opacity duration-200"
            [ngClass]="{
              'opacity-100': !isSidebarCollapsed,
              'opacity-0 hidden': isSidebarCollapsed
            }"
          >
            Administración
          </h2>
          <a
            class="group flex items-center p-2 rounded-sm transition-all duration-200 ease-in-out hover:bg-gray-800 focus:outline-none"
            [routerLink]="'admin/users'"
            routerLinkActive="active-link"
            [ngClass]="{
              'justify-center': isSidebarCollapsed,
              'justify-start gap-3': !isSidebarCollapsed
            }"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 transition-colors duration-200"
              [ngClass]="{
                'text-[var(--text-medium)] group-hover:text-white': true
              }"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z"
              />
            </svg>
            <span
              class="text-xs font-medium whitespace-nowrap text-[var(--text-medium)] group-hover:text-white overflow-hidden transition-all duration-200"
              [ngClass]="{
                ' opacity-100 max-w-full': !isSidebarCollapsed,
                'opacity-0 max-w-0': isSidebarCollapsed
              }"
            >
              Gestión de Usuarios
            </span>
          </a>
        </div>
      </div>
    </nav>

    <div class="mt-auto pt-6">
      <button
        (click)="toggleSidebar()"
        class="w-full flex items-center justify-center p-2 rounded-sm text-[var(--lightText)] bg-[var(--primary)] transition-all duration-200 ease-in-out focus:outline-none cursor-pointer"
        aria-label="Toggle sidebar"
      >
        <svg
          *ngIf="!isSidebarCollapsed"
          class="h-5 w-5 text-[var(--lightText)]"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M11 19l-7-7 7-7m8 14l-7-7 7-7"
          ></path>
        </svg>
        <svg
          *ngIf="isSidebarCollapsed"
          class="h-5 w-5 text-[var(--lightText)]"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 5l7 7-7 7M6 5l7 7-7 7"
          ></path>
        </svg>
      </button>
    </div>
  </aside>

  <div
    class="flex-grow w-full h-screen overflow-y-auto transition-all duration-300 ease-in-out"
    [ngClass]="{
      'ml-[220px]': !isSidebarCollapsed,
      'ml-[80px]': isSidebarCollapsed
    }"
    id="main-content-scroll-container"
  >
    <ng-content></ng-content>
  </div>
</div>
