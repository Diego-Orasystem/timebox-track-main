<div class="p-3 sm:p-3 bg-gray-50 font-sans">
  <div class="h-[calc(90vh-2rem)] bg-white rounded-sm shadow-sm py-6 transition-shadow duration-300">
    <!-- Contenedor del Gantt y Lista -->
    <div class="px-3 flex gap-4 h-[calc(100%-1rem)]">
      <div class="flex w-full gap-4 h-full">
        <!-- Lista de Tareas estilo MS Project -->
        <div class="w-1/4 h-full flex flex-col">
          <!-- Cabecera del listado -->
          <div class="bg-gradient-to-b from-gray-50 to-gray-100 border border-gray-300 rounded-t-sm pt-3 flex-shrink-0">
            <div class="px-4 py-2.5 border-b border-gray-300">
              <!-- Selector de proyecto -->
              <div class="flex items-center justify-between gap-3 w-full">
                <div class="flex-1">
                  <select
                    [(ngModel)]="selectedProductId"
                    (ngModelChange)="onProjectChange($event)"
                    class="block w-full px-4 py-4 rounded-sm text-xs border border-gray-200 focus:outline-none focus:ring-1 focus:ring-[var(--primary)] focus:border-[var(--primary)] transition-all duration-200 text-[var(--darkText)] bg-white"
                  >
                    <option value="" disabled>Seleccione un proyecto *</option>
                    <option *ngIf="selectedProductId != ''" value="">Limpiar</option>
                    <ng-container *ngIf="products$ | async as products">
                      <option *ngFor="let product of products" [value]="product.id">
                        {{ product.nombre }}
                      </option>
                    </ng-container>
                  </select>
                </div>
                <!-- Modificar el botón en la sección del selector -->
                <div class="flex-shrink-0 relative">
                  <button
                    (click)="toggleTooltip()"
                    [disabled]="!selectedProductId"
                    class="cursor-pointer text-[11px] inline-flex items-center justify-center px-3 py-3 bg-[var(--primary)] text-[var(--lightText)] rounded-sm disabled:opacity-50 disabled:cursor-not-allowed hover:bg-[var(--primaryDark)] transition-colors duration-200"
                  >
                    <svg
                      width="12px"
                      height="12px"
                      viewBox="0 0 24 24"
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      stroke="currentColor"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="3"
                        d="M12 5v14M5 12h14"
                      />
                    </svg>
                  </button>
                  
                  <!-- Tooltip con opciones -->
                  <div 
                    *ngIf="showTooltip" 
                    class="absolute top-full right-0 mt-1 bg-white border border-gray-200 rounded-sm shadow-lg z-50 min-w-[160px]"
                  >
                    <div class="py-1">
                      <button
                        (click)="openTimeboxModal()"
                        class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-gray-50 hover:text-[var(--primary)] transition-colors duration-150 flex items-center gap-2"
                      >
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                          <line x1="16" y1="2" x2="16" y2="6"></line>
                          <line x1="8" y1="2" x2="8" y2="6"></line>
                          <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        Nuevo Timebox
                      </button>
                      <button
                        (click)="openEntregableModal()"
                        class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-gray-50 hover:text-[var(--primary)] transition-colors duration-150 flex items-center gap-2"
                      >
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                          <path d="m9 13 2 2 4-4"></path>
                        </svg>
                        Nuevo Entregable
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <!-- Headers de columnas estilo Project -->
            <div class="mt-1 grid grid-cols-12 gap-2 px-3 py-2 text-[10px] font-semibold text-gray-600 uppercase tracking-wider border-b border-gray-300 bg-gray-100">
              <div class="col-span-5">Nombre</div>
              <div class="col-span-3 text-center">Inicio</div>
              <div class="col-span-3 text-center">Fin</div>
              <div class="col-span-1 text-center">Orden</div>
            </div>
          </div>

          <!-- Contenedor scrolleable de tareas -->
          <div class="border-x border-b border-gray-300 rounded-b-sm bg-white flex-1">
            <div class="overflow-y-auto h-full">
              <!-- Cascada: Entregable (padre) y Timeboxes (hijos) -->
              <ng-container *ngIf="entregablesForProduct.length > 0; else noEntregables">
                <div *ngFor="let ent of entregablesForProduct; let gi = index" class="border-b border-gray-200 last:border-b-0">
                  <!-- Fila del entregable -->
                  <div class="px-3 py-2 bg-gray-50 flex items-center gap-2">
                    <span class="flex-shrink-0 w-5 h-5 rounded-sm flex items-center justify-center text-[9px] font-bold text-white bg-gray-600">
                      {{ gi + 1 }}
                    </span>
                    <span class="font-semibold text-gray-800 truncate" [title]="ent.nombre">
                      {{ ent.nombre }} <span class="text-[10px] text-gray-500">({{ ent.tipo }})</span>
                    </span>
                  </div>

                  <!-- Hijos: timeboxes de este entregable -->
                  <div class="pl-6">
                    <ng-container *ngIf="getTasksForEntregable(ent.id).length; else noTimeboxes">
                      <div
                        *ngFor="let task of getTasksForEntregable(ent.id); let i = index"
                        [class.bg-slate-50]="selectedTaskId === task.id"
                        [class.border-l-4]="selectedTaskId === task.id"
                        [class.border-l-gray-800]="selectedTaskId === task.id"
                        class="border-b border-gray-200 py-1.5 pr-2 last:border-b-0 hover:bg-gray-50 transition-all duration-150"
                      >
                        <div class="grid grid-cols-12 gap-2 px-3 py-1.5 items-center text-xs">
                          <div class="col-span-5 flex items-center gap-1.5">
                            <span
                              class="flex-shrink-0 w-5 h-5 rounded-sm flex items-center justify-center text-[9px] font-bold text-white"
                              [style.background-color]="task.__color"
                            >
                              {{ i + 1 }}
                            </span>
                            <span class="font-medium text-gray-800 truncate" [title]="task.name">
                              {{ task.name }}
                            </span>
                          </div>
                          <div class="col-span-3 text-center text-gray-600 text-[11px] font-mono">
                            {{ task.start | date : "dd/MM/yy" }}
                          </div>
                          <div class="col-span-3 text-center text-gray-600 text-[11px] font-mono">
                            {{ task.end | date : "dd/MM/yy" }}
                          </div>
                          <div class="col-span-1 flex flex-col items-center gap-0.5 text-center">
                            <span
                              class="text-[10px] font-bold"
                              [class.text-[var(--secondary)]]="task.progress === 100"
                              [class.text-[var(--primary)]]="task.progress > 10 && task.progress < 100"
                              [class.text-[#A65F01]]="task.progress === 10"
                              [class.text-gray-400]="task.progress === 0"
                            >
                              {{ task.progress }}%
                            </span>
                            <div class="flex flex-col gap-0.5 mt-0.5">
                              <button
                                type="button"
                                class="w-4 h-4 flex items-center justify-center rounded-sm border border-gray-300 bg-white text-[9px] leading-none hover:bg-gray-100 cursor-pointer"
                                (click)="onArrowClick($event, ent.id, task.id, 'up')"
                                [class.opacity-40]="i === 0"
                                [class.cursor-not-allowed]="i === 0"
                                title="Mover arriba"
                              >
                                ▲
                              </button>
                              <button
                                type="button"
                                class="w-4 h-4 flex items-center justify-center rounded-sm border border-gray-300 bg-white text-[9px] leading-none hover:bg-gray-100 cursor-pointer"
                                (click)="onArrowClick($event, ent.id, task.id, 'down')"
                                [class.opacity-40]="i === (getTasksForEntregable(ent.id).length || 0) - 1"
                                [class.cursor-not-allowed]="i === (getTasksForEntregable(ent.id).length || 0) - 1"
                                title="Mover abajo"
                              >
                                ▼
                              </button>
                            </div>
                          </div>
                        </div>
                        <div class="px-3 pb-2">
                          <div class="w-full bg-gray-200 rounded-full h-1 overflow-hidden">
                            <div
                              class="h-full rounded-full transition-all duration-300 relative"
                              [style.width]="task.progress + '%'"
                              [style.background-color]="task.__color"
                            >
                              <div class="absolute inset-0 bg-white opacity-20"></div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </ng-container>
                    <ng-template #noTimeboxes>
                      <div class="px-3 py-2 text-[11px] text-gray-500 italic border-b border-gray-200">
                        No hay timeboxes para este entregable.
                      </div>
                    </ng-template>
                  </div>
                </div>
              </ng-container>

              <ng-template #noEntregables>
                <div class="px-3 py-2 text-[11px] text-gray-500 italic">
                  No hay entregables para el producto seleccionado.
                </div>
              </ng-template>
            </div>
          </div>
        </div>

        <!-- Gantt Chart -->
        <div class="w-3/4 h-full">
          <div #ganttRoot class="w-full h-full bg-white border border-gray-300 rounded"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-modal-create
  [show]="showModal"
  (close)="closeModal()"
  [mode]="modalMode"
  [timeboxData]="selectedTimebox"
  [productId]="selectedProductId"
  (timeboxOutput)="handleTimeboxSave($event)"
></app-modal-create>

<!-- Monta/desmonta el modal de Entregable para recrearlo -->
<app-modal-create-entregable
  *ngIf="entregableModalMounted"
  [show]="showEntregableModal"
  (close)="closeEntregableModal()"
  [productId]="selectedProductId"
  [entregables]="entregablesForProduct"
  (entregableOutput)="handleEntregableSave($event)"
></app-modal-create-entregable>
